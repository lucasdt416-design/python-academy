services:
  - type: web
    name: python-academy-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: ENVIRONMENT
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: python-academy-db
          property: connectionString
      - key: APP_ORIGIN
        sync: false
      - key: API_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
  - type: web
    name: python-academy
    runtime: node
    plan: starter
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start -- --port $PORT
    envVars:
      - key: BACKEND_URL
        sync: false
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
databases:
  - name: python-academy-db
    plan: basic-256mb
    databaseName: academy
    user: academy

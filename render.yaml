services:
  - type: web
    name: python-academy-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: ENVIRONMENT
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: python-academy-db
          property: connectionString
      # Signed-out rate limits count per visitor from this header, which Cloudflare (in front of
      # Render) sets and will not let a caller send. Without it, all signed-out visitors share one
      # counter. Checked live on 2026-10-25 (handoff 06 section 13.7).
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
  - type: web
    name: python-academy
    runtime: node
    plan: starter
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start -- --port $PORT
    envVars:
      - key: BACKEND_HOSTPORT
        fromService:
          type: web
          name: python-academy-api
          property: hostport
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
databases:
  - name: python-academy-db
    plan: basic-256mb
    databaseName: academy
    user: academy

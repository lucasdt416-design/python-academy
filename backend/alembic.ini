# Alembic configuration. The app runs migrations itself on startup (app/migrate.py);
# use the CLI only to write new migrations, e.g. from backend/:
#   alembic revision -m "describe the change"
# DATABASE_URL is read from the environment (see app/db.py).
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
